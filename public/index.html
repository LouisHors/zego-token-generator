<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zego Token Generate</title>
    <link rel="stylesheet" href="style/styles.css">
</head>

<body>
    <!-- 头部配置显示和修改按钮 -->
    <div class="header-config">
        <div class="config-display">当前 App ID: <span id="currentAppID">未配置</span></div>
        <button id="configButton" class="copy-btn">修改配置</button>
        <button id="logoutButton" class="copy-btn" style="background-color: #dc3545;">登出</button>
    </div>

    <!-- 配置模态窗口 -->
    <div id="configModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2>配置 App ID 和 Server Secret</h2>
            <div class="form-group">
                <label for="configAppID">App ID:</label>
                <input type="text" id="configAppID" name="configAppID" placeholder="请输入数字 App ID">
                <div class="error" id="configAppIDError"></div>
            </div>
            <div class="form-group">
                <label for="configServerSecret">Server Secret:</label>
                <input type="text" id="configServerSecret" name="configServerSecret" placeholder="请输入 32 位字母数字组合">
                <div class="error" id="configServerSecretError"></div>
            </div>
            <div class="modal-buttons">
                <button id="saveConfigButton" class="copy-btn">确认</button>
            </div>
        </div>
    </div>

    <h1>请填写参数</h1>

    <form id="myForm">
        <div class="form-group">
            <label for="userId">User ID:</label>
            <input type="text" id="userId" name="userId" pattern="[a-zA-Z0-9]+" title="仅限数字和字母">
            <div class="error" id="userIdError"></div>
        </div>

        <div class="form-group">
            <label for="roomId">Room ID:</label>
            <input type="text" id="roomId" name="roomId" pattern="[a-zA-Z0-9]+" title="仅限数字和字母">
            <div class="error" id="roomIdError"></div>
        </div>

        <div class="form-group">
            <label for="streamId">Stream ID:</label>
            <input type="text" id="streamId" name="streamId" pattern="[a-zA-Z0-9]+" title="仅限数字和字母">
            <div class="error" id="streamIdError"></div>
        </div>

        <div class="form-group">
            <label for="expireTime">有效期 (秒):</label>
            <input type="number" id="expireTime" name="expireTime" min="60" value="120" title="最小值为60秒">
            <div class="error" id="expireTimeError"></div>
        </div>

        <div class="form-group">
            <input type="checkbox" id="allowPublish" name="allowPublish">
            <label for="allowPublish">允许推流 (Allow Publish)</label>
        </div>

        <div class="form-group">
            <input type="checkbox" id="allowPlay" name="allowPlay">
            <label for="allowPlay">允许拉流 (Allow Play)</label>
        </div>

        <button type="button" id="generate">生成</button>
        <button type="button" id="generateBasic"
            style="margin-left: 10px; background-color: #28a745;">生成基础token</button>
    </form>

    <div id="output" class="output" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>生成的值:</h2>
            <button id="copyButton" class="copy-btn" title="复制到剪贴板">一键复制</button>
        </div>
        <pre id="result"></pre>
    </div>

    <!-- Token History Section -->
    <div id="tokenHistory" class="token-history" style="display: none;">
        <h3>Token 历史记录</h3>
        <table class="token-history-table">
            <thead>
                <tr>
                    <th>Token</th>
                    <th>生成时间</th>
                </tr>
            </thead>
            <tbody id="tokenHistoryBody">
                <!-- Token history rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        // 首先检查用户是否已登录
        (async function checkLoginStatus() {
            try {
                // 发送请求检查登录状态
                const response = await fetch('/api/check-login-status');

                if (response.status === 401) {
                    // 未登录，立即跳转到登录页面
                    console.log('User not logged in, redirecting to login page');
                    window.location.href = '/page/login.html';
                    return;
                }
            } catch (error) {
                console.error('Error checking login status:', error);
                // 出错时也跳转到登录页面
                window.location.href = '/page/login.html';
                return;
            }
        })();

        // 页面关闭或刷新时自动登出
        window.addEventListener('beforeunload', function (e) {
            // 使用同步的 XMLHttpRequest 发送登出请求
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/logout', false); // false 表示同步请求
            xhr.setRequestHeader('Content-Type', 'application/json');
            try {
                xhr.send();
                console.log('User logged out successfully');
            } catch (error) {
                console.error('Error during logout:', error);
            }
        });

        // 元素引用
        const userIdInput = document.getElementById('userId');
        const roomIdInput = document.getElementById('roomId');
        const streamIdInput = document.getElementById('streamId');
        const allowPublishCheckbox = document.getElementById('allowPublish');
        const allowPlayCheckbox = document.getElementById('allowPlay');
        const expireTimeInput = document.getElementById('expireTime');
        const generateButton = document.getElementById('generate');
        const generateBasicButton = document.getElementById('generateBasic');
        const outputDiv = document.getElementById('output');
        const resultPre = document.getElementById('result');
        const copyButton = document.getElementById('copyButton');
        const form = document.getElementById('myForm');
        const tokenHistoryDiv = document.getElementById('tokenHistory');
        const tokenHistoryBody = document.getElementById('tokenHistoryBody');

        // 配置相关元素
        const configButton = document.getElementById('configButton');
        const configModal = document.getElementById('configModal');
        const configAppIDInput = document.getElementById('configAppID');
        const configServerSecretInput = document.getElementById('configServerSecret');
        const saveConfigButton = document.getElementById('saveConfigButton');
        const currentAppIDSpan = document.getElementById('currentAppID');
        const configAppIDError = document.getElementById('configAppIDError');
        const configServerSecretError = document.getElementById('configServerSecretError');
        const logoutButton = document.getElementById('logoutButton');

        // 当前配置
        let currentAppID = '';
        let currentServerSecret = '';

        const userIdError = document.getElementById('userIdError');
        const roomIdError = document.getElementById('roomIdError');
        const streamIdError = document.getElementById('streamIdError');
        const expireTimeError = document.getElementById('expireTimeError');

        function validateInput(inputElement, errorElement) {
            const pattern = new RegExp(inputElement.pattern);
            if (!pattern.test(inputElement.value) && inputElement.value !== '') {
                errorElement.textContent = inputElement.title;
                inputElement.setCustomValidity(inputElement.title); // Mark as invalid for form submission
                return false;
            } else {
                errorElement.textContent = '';
                inputElement.setCustomValidity(''); // Mark as valid
                return true;
            }
        }

        function validateExpireTime() {
            // 确保使用基数 10 进行解析
            const value = parseInt(expireTimeInput.value, 10);

            // 输出调试信息
            console.log('Validating expireTime:', expireTimeInput.value, 'Parsed value:', value);

            if (isNaN(value) || value < 60) {
                expireTimeError.textContent = '有效期必须是数字且最小值为60秒';
                expireTimeInput.setCustomValidity('有效期必须是数字且最小值为60秒');
                return false;
            } else {
                expireTimeError.textContent = '';
                expireTimeInput.setCustomValidity('');
                return true;
            }
        }

        // 验证 App ID 和 Server Secret
        function validateAppID(value) {
            if (!value) {
                configAppIDError.textContent = 'App ID 不能为空';
                return false;
            }

            const numericValue = parseInt(value, 10);
            if (isNaN(numericValue)) {
                configAppIDError.textContent = 'App ID 必须是数字';
                return false;
            }

            configAppIDError.textContent = '';
            return true;
        }

        function validateServerSecret(value) {
            if (!value) {
                configServerSecretError.textContent = 'Server Secret 不能为空';
                return false;
            }

            if (value.length !== 32) {
                configServerSecretError.textContent = 'Server Secret 必须是 32 位字符';
                return false;
            }

            if (!/^[a-zA-Z0-9]+$/.test(value)) {
                configServerSecretError.textContent = 'Server Secret 只能包含字母和数字';
                return false;
            }

            configServerSecretError.textContent = '';
            return true;
        }

        // 更新配置显示
        function updateConfigDisplay() {
            if (currentAppID) {
                currentAppIDSpan.textContent = currentAppID;
            } else {
                currentAppIDSpan.textContent = '未配置';
            }
        }

        // 检查是否已配置
        function isConfigured() {
            return currentAppID && currentServerSecret;
        }

        // 页面加载时获取配置
        async function fetchConfig() {
            try {
                console.log('Fetching config from server...');

                // 使用 XMLHttpRequest 而不是 fetch
                const xhr = new XMLHttpRequest();
                xhr.open('GET', '/get-config', true);

                // 设置请求超时
                xhr.timeout = 5000; // 5 秒

                // 创建一个 Promise 来处理异步请求
                const result = await new Promise((resolve, reject) => {
                    xhr.onload = function () {
                        console.log('Response status:', xhr.status);

                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                console.log('Parsed response:', response);
                                resolve(response);
                            } catch (error) {
                                console.error('Error parsing JSON:', error);
                                resolve(null);
                            }
                        } else if (xhr.status === 401) {
                            // 401 未授权，表示未登录
                            console.error('Unauthorized: User not logged in');
                            // 抛出错误而不是返回 null，这样可以在调用方捕获并处理
                            reject(new Error('Unauthorized'));
                        } else {
                            console.error('Server returned error:', xhr.status);
                            resolve(null);
                        }
                    };

                    xhr.onerror = function () {
                        console.error('Network error occurred');
                        resolve(null);
                    };

                    xhr.ontimeout = function () {
                        console.error('Request timed out');
                        resolve(null);
                    };

                    // 发送请求
                    xhr.send();
                });

                if (!result) {
                    return false;
                }

                if (result.success) {
                    currentAppID = result.appID;
                    // 注意：服务器不返回 serverSecret，只返回 appID
                    // serverSecret 只在服务器端使用

                    // 更新显示
                    updateConfigDisplay();
                    return true;
                } else {
                    console.log('Config not found or invalid');
                    return false;
                }
            } catch (error) {
                console.error('Error fetching config:', error);
                return false;
            }
        }

        // 获取令牌历史记录
        async function fetchTokenHistory() {
            try {
                console.log('Fetching token history...');
                const response = await fetch('/get-token-history');
                const result = await response.json();

                if (result.success) {
                    return result.tokenHistory;
                } else {
                    console.error('Failed to fetch token history:', result.error);
                    return [];
                }
            } catch (error) {
                console.error('Error fetching token history:', error);
                return [];
            }
        }

        // 显示令牌历史记录
        function displayTokenHistory(tokenHistory) {
            // 清空现有历史记录
            tokenHistoryBody.innerHTML = '';

            if (tokenHistory.length === 0) {
                tokenHistoryDiv.style.display = 'none';
                return;
            }

            // 添加每个令牌到表格
            tokenHistory.forEach((entry, index) => {
                const row = document.createElement('tr');
                row.className = 'token-row';
                row.dataset.index = index;

                // 格式化时间戳
                const timestamp = new Date(entry.timestamp);
                const formattedDate = timestamp.toLocaleDateString();
                const formattedTime = timestamp.toLocaleTimeString();

                // 根据 token 长度确定字体大小类
                let tokenLengthClass = 'token-length-small';
                if (entry.token.length > 500) {
                    tokenLengthClass = 'token-length-large';
                } else if (entry.token.length > 200) {
                    tokenLengthClass = 'token-length-medium';
                }

                row.innerHTML = `
                    <td class="token-value" title="${entry.token}">
                        <button class="copy-token-btn" data-token="${entry.token}">复制</button>
                        <div class="${tokenLengthClass}">${entry.token}</div>
                    </td>
                    <td class="token-timestamp">${formattedDate} ${formattedTime}</td>
                `;

                // 创建详情行
                const detailsRow = document.createElement('tr');
                detailsRow.className = 'token-details-row';
                // 格式化 plainText 以提高可读性
                let formattedPlainText = entry.plainText;
                let tokenParams = '';

                try {
                    // 尝试将 JSON 字符串格式化为更可读的形式
                    const jsonObj = JSON.parse(entry.plainText);
                    formattedPlainText = JSON.stringify(jsonObj, null, 2);

                    // 提取常用参数并格式化显示
                    if (jsonObj.payload) {
                        try {
                            const payload = typeof jsonObj.payload === 'string' ? JSON.parse(jsonObj.payload) : jsonObj.payload;

                            // 构建参数显示
                            const paramsList = [];

                            if (payload.room_id) {
                                paramsList.push(`<div><strong>Room ID:</strong> ${payload.room_id}</div>`);
                            }

                            if (payload.stream_id_list && payload.stream_id_list.length) {
                                paramsList.push(`<div><strong>Stream ID:</strong> ${payload.stream_id_list.join(', ')}</div>`);
                            }

                            if (payload.privilege) {
                                const privileges = [];
                                if (payload.privilege['1'] === 1) privileges.push('Login Room');
                                if (payload.privilege['2'] === 1) privileges.push('Publish');
                                if (payload.privilege['3'] === 1) privileges.push('Play');

                                paramsList.push(`<div><strong>Privileges:</strong> ${privileges.join(', ')}</div>`);
                            }

                            if (paramsList.length > 0) {
                                tokenParams = `
                                <div class="token-params">
                                    <h4>Token Parameters:</h4>
                                    ${paramsList.join('')}
                                </div>`;
                            }
                        } catch (e) {
                            console.error('Error parsing payload:', e);
                        }
                    }
                } catch (e) {
                    // 如果不是有效的 JSON，保持原样
                }

                detailsRow.innerHTML = `
                    <td colspan="2" class="token-details">
                        ${tokenParams}
                        <div class="token-raw-data">
                            <h4>Raw Data:</h4>
                            <pre>${formattedPlainText}</pre>
                        </div>
                    </td>
                `;

                // 添加点击事件处理程序
                row.addEventListener('click', (e) => {
                    // 如果点击的是复制按钮或其子元素，不展开/折叠行
                    if (e.target.classList.contains('copy-token-btn') ||
                        e.target.closest('.copy-token-btn')) {
                        return;
                    }
                    // 仅切换类名，依靠CSS选择器来控制详情行的显示/隐藏
                    row.classList.toggle('expanded');

                    // 打印调试信息
                    console.log('Row clicked, expanded:', row.classList.contains('expanded'));
                });

                // 添加复制按钮的事件处理
                const copyBtn = row.querySelector('.copy-token-btn');
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止事件冒泡，避免触发行的点击事件
                    const token = e.target.dataset.token;
                    navigator.clipboard.writeText(token).then(() => {
                        // 复制成功
                        const originalText = e.target.textContent;
                        e.target.textContent = '已复制';
                        e.target.style.color = '#28a745';

                        // 2秒后恢复原样式
                        setTimeout(() => {
                            e.target.textContent = originalText;
                            e.target.style.color = '';
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy token:', err);
                        alert('复制失败，请手动复制');
                    });
                });

                // 添加到表格
                tokenHistoryBody.appendChild(row);
                tokenHistoryBody.appendChild(detailsRow);
            });

            // 显示历史记录区域
            tokenHistoryDiv.style.display = 'block';
        }

        // 刷新令牌历史记录
        async function refreshTokenHistory() {
            const tokenHistory = await fetchTokenHistory();
            displayTokenHistory(tokenHistory);
        }

        // 清除所有cookie的函数
        async function clearAllCookies() {
            try {
                const response = await fetch('/api/clear-cookies', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    console.log('All cookies cleared successfully');
                    return true;
                } else {
                    console.error('Failed to clear cookies:', result.message || 'Unknown error');
                    return false;
                }
            } catch (error) {
                console.error('Error clearing cookies:', error);
                return false;
            }
        }

        // 登出按钮点击事件
        logoutButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，重定向到登录页面
                    window.location.href = '/page/login.html';
                } else {
                    alert('登出失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('Logout error:', error);
                alert('登出请求失败，请重试');
            }
        });

        // 页面加载时清除cookie并获取配置
        (async function () {
            // 首先清除所有cookie，确保用户需要重新登录
            // 注释下面这行代码可以允许用户保持登录状态
            // await clearAllCookies();

            try {
                const configExists = await fetchConfig();

                // 如果未配置，显示配置模态窗口
                if (!configExists) {
                    configModal.style.display = 'flex';
                } else {
                    // 如果已配置，获取令牌历史记录
                    await refreshTokenHistory();
                }
            } catch (error) {
                // 如果发生错误（如未登录），不显示配置模态窗口
                console.error('Error fetching config:', error);
                // 如果是401错误（未登录），不做任何处理，让服务器重定向到登录页面
            }
        })();

        // 配置按钮点击事件
        configButton.addEventListener('click', () => {
            // 如果已有配置，预填充输入框
            configAppIDInput.value = currentAppID;
            configServerSecretInput.value = currentServerSecret;

            // 清除错误提示
            configAppIDError.textContent = '';
            configServerSecretError.textContent = '';

            // 显示模态窗口
            configModal.style.display = 'flex';
        });

        // 保存配置按钮点击事件
        saveConfigButton.addEventListener('click', async () => {
            const appID = configAppIDInput.value.trim();
            const serverSecret = configServerSecretInput.value.trim();

            const isAppIDValid = validateAppID(appID);
            const isServerSecretValid = validateServerSecret(serverSecret);

            if (isAppIDValid && isServerSecretValid) {
                try {
                    // 禁用按钮，防止重复提交
                    saveConfigButton.disabled = true;
                    saveConfigButton.textContent = '保存中...';

                    // 发送请求到服务器保存配置
                    console.log('Saving config to server...');

                    // 使用 XMLHttpRequest 而不是 fetch
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/save-config', true);
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    // 设置请求超时
                    xhr.timeout = 5000; // 5 秒

                    // 创建一个 Promise 来处理异步请求
                    const result = await new Promise((resolve, reject) => {
                        xhr.onload = function () {
                            console.log('Response status:', xhr.status);

                            if (xhr.status >= 200 && xhr.status < 300) {
                                try {
                                    const response = JSON.parse(xhr.responseText);
                                    console.log('Parsed response:', response);
                                    resolve(response);
                                } catch (error) {
                                    console.error('Error parsing JSON:', error);
                                    reject(new Error('Invalid JSON response'));
                                }
                            } else {
                                console.error('Server returned error:', xhr.status);
                                reject(new Error(`Server returned ${xhr.status}`));
                            }
                        };

                        xhr.onerror = function () {
                            console.error('Network error occurred');
                            reject(new Error('Network error occurred'));
                        };

                        xhr.ontimeout = function () {
                            console.error('Request timed out');
                            reject(new Error('Request timed out'));
                        };

                        // 发送请求
                        xhr.send(JSON.stringify({ appID, serverSecret }));
                    });

                    // 更新当前配置
                    currentAppID = appID;
                    currentServerSecret = serverSecret;

                    // 更新显示
                    updateConfigDisplay();

                    // 关闭模态窗口
                    configModal.style.display = 'none';
                } catch (error) {
                    console.error('Error saving config:', error);
                    alert('配置保存失败，请重试');
                } finally {
                    // 恢复按钮状态
                    saveConfigButton.disabled = false;
                    saveConfigButton.textContent = '确认';
                }
            }
        });

        // 表单元素验证
        userIdInput.addEventListener('input', () => validateInput(userIdInput, userIdError));
        roomIdInput.addEventListener('input', () => validateInput(roomIdInput, roomIdError));
        streamIdInput.addEventListener('input', () => validateInput(streamIdInput, streamIdError));
        // 添加多个事件监听器，确保有效期输入框的值变化时立即进行验证
        expireTimeInput.addEventListener('input', validateExpireTime);
        expireTimeInput.addEventListener('change', validateExpireTime);
        expireTimeInput.addEventListener('blur', validateExpireTime);

        generateButton.addEventListener('click', async () => {
            // Trigger validation on all fields before generating
            const isUserIdValid = validateInput(userIdInput, userIdError);
            const isRoomIdValid = validateInput(roomIdInput, roomIdError);
            const isStreamIdValid = validateInput(streamIdInput, streamIdError);
            const isExpireTimeValid = validateExpireTime();

            // 添加对streamId是否为空的校验
            if (streamIdInput.value.trim() === '') {
                streamIdError.textContent = 'Stream ID不能为空';
                streamIdInput.setCustomValidity('Stream ID不能为空');
                isStreamIdValid = false;
            }

            // Clear previous result/error
            resultPre.textContent = '';
            outputDiv.style.display = 'none';

            // 检查是否已配置 App ID 和 Server Secret
            if (!isConfigured()) {
                alert('请先配置 App ID 和 Server Secret');
                configModal.style.display = 'flex';
                return;
            }

            // Only proceed if all relevant fields are valid
            if (isUserIdValid && isRoomIdValid && isStreamIdValid && isExpireTimeValid) {
                const dataToSend = {
                    userId: userIdInput.value,
                    roomId: roomIdInput.value,
                    streamId: streamIdInput.value,
                    allowPublish: allowPublishCheckbox.checked ? 1 : 0,
                    allowPlay: allowPlayCheckbox.checked ? 1 : 0,
                    expireTime: parseInt(expireTimeInput.value, 10)
                };

                try {
                    // Disable button during request
                    generateButton.disabled = true;
                    generateButton.textContent = '生成中...';

                    const response = await fetch('/generate-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(dataToSend),
                    });

                    const result = await response.json();

                    if (response.ok) {
                        // Display the token
                        document.getElementById('output').querySelector('h2').textContent = '生成的 Token:'; // Change title
                        resultPre.textContent = result.token;
                        outputDiv.style.display = 'block';

                        // 刷新令牌历史记录
                        refreshTokenHistory();
                    } else {
                        // Display error message from server
                        document.getElementById('output').querySelector('h2').textContent = '生成失败:'; // Change title
                        resultPre.textContent = `错误: ${result.error}`;
                        outputDiv.style.display = 'block';
                        // alert(`生成Token失败: ${result.error}`);
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    document.getElementById('output').querySelector('h2').textContent = '请求错误:'; // Change title
                    resultPre.textContent = `无法连接到服务器或发生网络错误: ${error.message}`;
                    outputDiv.style.display = 'block';
                    // alert('请求错误: 无法连接到服务器。');
                } finally {
                    // Re-enable button
                    generateButton.disabled = false;
                    generateButton.textContent = '生成';
                }

            } else {
                // Keep the alert for immediate feedback on validation failure
                alert('请修正输入错误！');
                outputDiv.style.display = 'none'; // Ensure output is hidden if validation fails initially
            }
        });

        // 基础token生成按钮的事件监听器
        generateBasicButton.addEventListener('click', async () => {
            // Trigger validation on all fields before generating
            const isUserIdValid = validateInput(userIdInput, userIdError);
            const isRoomIdValid = validateInput(roomIdInput, roomIdError);
            const isExpireTimeValid = validateExpireTime();
            // 基础token不需要校验 streamId
            // 清除之前的streamId错误提示（如果有）
            streamIdError.textContent = '';
            streamIdInput.setCustomValidity('');

            // Clear previous result/error
            resultPre.textContent = '';
            outputDiv.style.display = 'none';

            // 检查是否已配置 App ID 和 Server Secret
            if (!isConfigured()) {
                alert('请先配置 App ID 和 Server Secret');
                configModal.style.display = 'flex';
                return;
            }

            // Only proceed if all relevant fields are valid
            if (isUserIdValid && isRoomIdValid && isExpireTimeValid) {
                const dataToSend = {
                    userId: userIdInput.value,
                    roomId: roomIdInput.value,
                    streamId: streamIdInput.value,
                    allowPublish: allowPublishCheckbox.checked ? 1 : 0,
                    allowPlay: allowPlayCheckbox.checked ? 1 : 0,
                    expireTime: parseInt(expireTimeInput.value, 10)
                };

                try {
                    // Disable button during request
                    generateBasicButton.disabled = true;
                    generateBasicButton.textContent = '生成中...';

                    const response = await fetch('/generate-basic-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(dataToSend),
                    });

                    const result = await response.json();

                    if (response.ok) {
                        // Display the token
                        document.getElementById('output').querySelector('h2').textContent = '生成的基础 Token:'; // Change title
                        resultPre.textContent = result.token;
                        outputDiv.style.display = 'block';

                        // 刷新令牌历史记录
                        refreshTokenHistory();
                    } else {
                        // Display error message from server
                        document.getElementById('output').querySelector('h2').textContent = '生成失败:'; // Change title
                        resultPre.textContent = `错误: ${result.error}`;
                        outputDiv.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    document.getElementById('output').querySelector('h2').textContent = '请求错误:'; // Change title
                    resultPre.textContent = `无法连接到服务器或发生网络错误: ${error.message}`;
                    outputDiv.style.display = 'block';
                } finally {
                    // Re-enable button
                    generateBasicButton.disabled = false;
                    generateBasicButton.textContent = '生成基础token';
                }

            } else {
                // Keep the alert for immediate feedback on validation failure
                alert('请修正输入错误！');
                outputDiv.style.display = 'none'; // Ensure output is hidden if validation fails initially
            }
        });

        // 复制按钮的点击事件
        copyButton.addEventListener('click', () => {
            // 获取要复制的文本
            const textToCopy = resultPre.textContent;

            // 如果没有文本，不执行复制
            if (!textToCopy.trim()) return;

            // 使用剪贴板 API 复制文本
            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    // 复制成功，显示成功状态
                    copyButton.textContent = '复制成功！';
                    copyButton.classList.add('success');

                    // 2秒后恢复按钮文本
                    setTimeout(() => {
                        copyButton.textContent = '一键复制';
                        copyButton.classList.remove('success');
                    }, 2000);
                })
                .catch(err => {
                    // 复制失败，显示错误信息
                    console.error('复制失败:', err);
                    copyButton.textContent = '复制失败';

                    // 2秒后恢复按钮文本
                    setTimeout(() => {
                        copyButton.textContent = '一键复制';
                    }, 2000);
                });
        });

    </script>

</body>

</html>
